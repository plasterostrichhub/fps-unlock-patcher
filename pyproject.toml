[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fps-unlock-patcher"
version = "0.9.3"
description = "Frame limiter / FPS unlock patcher for Windows games — service-oriented patcher core with per-engine adapters."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fps-unlock-patcher contributors" }]
keywords = ["fps", "frame-limiter", "unlock", "patcher", "directx", "vulkan", "modding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "click>=8.1",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
fps-unlock = "fps_unlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"